    <!-- Splash: a tall, phone-shaped version of the catalog cover built from pieces of it (logo, banner, product photo)
         plus live text, so it fills any tall screen without cropping. Images are preloaded and in the SW precache. -->
    <link rel="preload" as="image" href="/splash-photo.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/splash-mark.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/splash-banner.webp" type="image/webp" fetchpriority="high" />

    <style>
      #splash {
        --sp-blue: #0a22c4; --sp-frame: #0a8bf4;
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; flex-direction: column; align-items: center;
        padding: max(18px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
        background: #fff; color: var(--sp-blue);
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, ui-sans-serif, system-ui, sans-serif;
        transition: opacity 450ms ease, visibility 0s linear 450ms;
      }
      #splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      /* thin blue frame like the cover; the banner runs across it */
      #splash .sp-frame { position: absolute; inset: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); border: 2px solid var(--sp-frame); pointer-events: none; }
      #splash > :not(.sp-frame) { position: relative; flex: none; }
      #splash img { display: block; opacity: 0; transition: opacity 200ms ease; }
      #splash img.ok { opacity: 1; }
      #splash .sp-top { width: calc(100% - 40px); display: flex; flex-direction: column; align-items: center; padding-top: 2.2vh; }
      #splash .sp-logo { height: clamp(84px, 15.5vh, 150px); width: auto; max-width: 78%; aspect-ratio: 720 / 358; }
      #splash .sp-addr { display: flex; justify-content: center; align-items: stretch; gap: 14px; margin-top: 2vh; font-size: min(14px, 3.7vw); line-height: 1.4; text-align: center; }
      #splash .sp-addr p { margin: 0; }
      #splash .sp-addr i { width: 1.5px; background: var(--sp-blue); opacity: .8; }
      #splash .sp-phone { margin: 1vh 0 0; padding-top: .8vh; min-width: 74%; border-top: 1.5px solid var(--sp-blue); text-align: center; font-size: min(14px, 3.7vw); }
      #splash .sp-banner {
        width: 100%; margin-top: 2.6vh; aspect-ratio: 1080 / 96;
        background: linear-gradient(90deg, #033a8e 0%, #0b5cc4 50%, #033a8e 100%);
        display: grid; place-items: center; color: #fff; font: 900 min(30px, 7.4vw)/1 "Arial Black", "Segoe UI", Roboto, sans-serif; letter-spacing: .02em;
      }
      @supports not (aspect-ratio: 1 / 1) { #splash .sp-banner { height: 8.9vw; } #splash .sp-logo { height: calc(min(64vw, 300px) * 358 / 720); } }
      #splash .sp-banner img { position: absolute; inset: 0; width: 100%; height: 100%; }
      #splash .sp-lines { width: calc(100% - 28px); margin: 1.4vh 0 0; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: min(11px, 2.42vw); letter-spacing: .04em; white-space: nowrap; }
      #splash .sp-lines::before, #splash .sp-lines::after { content: ""; flex: 1 1 0; min-width: 0; max-width: 40px; height: 1.5px; background: var(--sp-blue); }
      /* product photo takes the remaining height; full width, never cropped; light blueprint tint fills any extra height */
      #splash .sp-photo {
        flex: 1 1 auto; min-height: 120px; width: calc(100% - 20px); margin-top: .8vh; display: flex; align-items: center; justify-content: center;
      }
      #splash .sp-photo img { width: 100%; height: 100%; object-fit: contain; object-position: 50% 50%; max-height: 100%;
        /* soften the photo's top/bottom edges */
        -webkit-mask-image: linear-gradient(transparent 0, #000 4%, #000 90%, transparent 100%); mask-image: linear-gradient(transparent 0, #000 4%, #000 90%, transparent 100%);
        mix-blend-mode: multiply; /* the photo's white paper lets the blueprint tint show through, so there is no visible edge */ }
      #splash .sp-photo::before {
        content: ""; position: absolute; inset: 0; background: url("/blueprint.png") center / cover no-repeat; opacity: 1;
        -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent 100%); mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
      }
      #splash .sp-photo img { position: relative; }
      #splash .sp-tag { margin: .6vh 0 0; text-align: center; font-style: italic; font-size: min(16.5px, 3.85vw); line-height: 1.3; white-space: nowrap; }
            #splash .splash-bar { margin: 2.6vh 0 2.4vh; width: min(56vw, 220px); height: 4px; border-radius: 4px; background: #d5dde6; overflow: hidden; }
      #splash .splash-bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #033b82;
        animation: splash-bar 1.2s ease-in-out infinite;
      }
      @keyframes splash-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      #splash.splash-error .sp-photo, #splash.splash-error .sp-tag, #splash.splash-error .splash-bar { display: none; }
      #splash.splash-error .splash-msg { margin-top: 4vh; }
      #splash .splash-msg { display: none; width: calc(100% - 64px); max-width: 320px; text-align: center; font-size: 14px; line-height: 1.45; color: #14181c; }
      #splash.splash-error .splash-msg { display: block; }
      #splash .splash-msg p { margin: 0 0 14px; }
      #splash .splash-msg small { display: block; margin-top: 10px; color: #5c6770; font-size: 12px; word-break: break-word; }
      #splash .splash-msg button {
        display: block; width: 100%; min-height: 44px; margin-top: 10px; border-radius: 0.9rem; font: inherit; font-weight: 600; cursor: pointer;
        border: 1px solid #d5dde6; background: #fff; color: #14181c;
      }
      #splash .splash-msg button.primary { border-color: #033b82; background: #033b82; color: #fff; }
      #pwa-toast {
        position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 10000;
        transform: translate(-50%, 140%); opacity: 0; transition: transform 250ms ease, opacity 250ms ease;
        display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 24px); width: max-content;
        padding: 12px 14px; border-radius: 0.9rem; background: #033b82; color: #fff;
        font: 500 14px/1.35 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; box-shadow: 0 8px 24px rgba(0,30,70,.25);
      }
      #pwa-toast.show { transform: translate(-50%, 0); opacity: 1; }
      #pwa-toast button { flex: none; min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: #fff; color: #033b82; font: inherit; font-weight: 600; cursor: pointer; }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
      }
    </style>
    <script>
      /* Boot guard: if the app's code can't load or start (stale cached page pointing at old files, a network
         hiccup, an unsupported browser), never leave the splash spinning forever. Retry once automatically with
         a cache-busting reload, then show a readable message with Reload / Reset buttons. */
      (function () {
        var base = location.pathname.replace(/[^/]*$/, "");
        var S = (window.__sdvBoot = { mounted: false, failed: false });
        function store(k, v) { try { return v === undefined ? sessionStorage.getItem(k) : sessionStorage.setItem(k, v); } catch (e) { return null; } }
        function hardReload(reset) {
          var go = function () { location.replace(base + "?r=" + Date.now()); };
          if (!reset) return go();
          var jobs = [];
          try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return r.scope.indexOf(location.origin + base) === 0; }).map(function (r) { return r.unregister(); })); })); } catch (e) {}
          try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf("sdv-") === 0; }).map(function (k) { return caches.delete(k); })); })); } catch (e) {}
          Promise.all(jobs).then(go, go);
          setTimeout(go, 3000);
        }
        S.reload = hardReload;
        function show(title, detail) {
          if (S.mounted || S.failed) return;
          S.failed = true;
          var el = document.getElementById("splash"), box = document.getElementById("splash-msg");
          if (!el || !box) return;
          box.innerHTML = "";
          var p = document.createElement("p"); p.textContent = title; box.appendChild(p);
          var b1 = document.createElement("button"); b1.type = "button"; b1.className = "primary"; b1.textContent = "Reload";
          b1.onclick = function () { hardReload(false); }; box.appendChild(b1);
          var b2 = document.createElement("button"); b2.type = "button"; b2.textContent = "Reset app & reload";
          b2.onclick = function () { hardReload(true); }; box.appendChild(b2);
          if (detail) { var sm = document.createElement("small"); sm.textContent = detail; box.appendChild(sm); }
          el.classList.add("splash-error");
        }
        S.show = show;
        function assetFailed(url) {
          if (S.mounted) return;
          if (!store("sdv-retried")) { store("sdv-retried", "1"); hardReload(true); return; }
          show("The app couldn’t download all of its files. Check your connection and tap Reload.", "Missing: " + url.replace(/^.*\//, ""));
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t !== window && t.tagName) {
            /* resource load errors: only the app's scripts/styles matter; a missing splash image must not trip the guard */
            var u = t.src || t.href || "";
            if ((t.tagName === "SCRIPT" || t.tagName === "LINK") && u.indexOf("/assets/") !== -1) assetFailed(u);
            return;
          }
          show("Something went wrong while starting the app.", e.message || "");
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason; var m = (r && (r.message || r)) + "";
          if (/dynamically imported module|Importing a module script failed|Failed to fetch/i.test(m)) assetFailed(m);
        });
        setTimeout(function () {
          if (!S.mounted) show("This is taking longer than usual. Your connection may be slow.", "");
        }, 15000);
      })();
    </script>

  <body>
    <div id="splash" role="status" aria-label="Loading Spiral Systems catalog">
      <div class="sp-frame" aria-hidden="true"></div>
      <div class="sp-top">
        <img class="sp-logo" src="/splash-mark.webp" alt="Spiral Systems Incorporated" width="720" height="358" fetchpriority="high" onload="this.className+=' ok'" />
        <div class="sp-addr">
          <p>860 Old Hwy 51<br />Nesbit, MS 38651</p>
          <i aria-hidden="true"></i>
          <p>399 Old Hickory Blvd,<br />Old Hickory, TN 37138</p>
        </div>
        <p class="sp-phone">Phone: 1-662-429-0373</p>
      </div>
      <div class="sp-banner">PRODUCT CATALOG<img src="/splash-banner.webp" alt="" width="1080" height="96" onload="this.className='ok'" /></div>
      <p class="sp-lines">ROUND • OVAL • FITTINGS • ACCESSORIES • CUSTOM FABRICATION</p>
      <div class="sp-photo"><img src="/splash-photo.webp" alt="Spiral duct, elbow, reducer and tee" width="1080" height="716" fetchpriority="high" onload="this.className='ok'" /></div>
      <p class="sp-tag">Quality Spiral Duct Products<br />for Commercial, Industrial and Custom Applications</p>
      <div class="splash-bar" aria-hidden="true"></div>
      <div class="splash-msg" id="splash-msg" role="alert"></div>
